<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CST Automotive · Shop schedule</title>
<style>
:root{color-scheme:light dark;--bg:#EEF1F3;--surface:#fff;--ink:#0E1B26;--muted:#51616E;--line:#CBD3D9;--brand:#0F4C75;--signal:#F2B705;--signal-ink:#1A1400;--closed:#A6372B}
@media (prefers-color-scheme:dark){:root{--bg:#0C141B;--surface:#14202A;--ink:#E9EEF2;--muted:#93A3AF;--line:#26343F;--brand:#6FB6E3;--signal:#F4B81A;--closed:#EF8A7C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
header b{font-size:18px}
main{max-width:1000px;margin:0 auto;padding:20px clamp(16px,4vw,32px) 60px}
h2{font-size:18px;margin:28px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:3px;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
button.danger{color:var(--closed)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.login{max-width:380px;margin:60px auto}
.login .row{grid-template-columns:1fr}
.msg{color:var(--closed);margin:8px 0 0;min-height:1.2em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
li small{display:block;color:var(--muted)}
.when{font-weight:700}
.day{margin:18px 0 6px;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.empty{color:var(--muted)}
[hidden]{display:none!important}
a{color:var(--brand)}
</style>
</head>
<body>
<div id="login" class="card login" hidden>
  <h1 style="font-size:20px;margin:0 0 12px">Shop schedule sign in</h1>
  <div class="row">
    <div><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="primary" id="go">Sign in</button>
  </div>
  <p class="msg" id="lmsg" role="alert"></p>
</div>

<div id="app" hidden>
  <header><b>CST Automotive · Schedule</b><span><a href="booking.html">Booking page</a> · <button id="out">Sign out</button></span></header>
  <main>
    <h2>Block off time</h2>
    <div class="card">
      <div class="row">
        <div><label for="bd">Day</label><input id="bd" type="date"></div>
        <div><label for="bf">From</label><input id="bf" type="time" value="09:00" step="1800"></div>
        <div><label for="bt">To</label><input id="bt" type="time" value="17:00" step="1800"></div>
        <div><label for="br">Reason (private)</label><input id="br" maxlength="200" placeholder="Lunch, parts delivery, closed"></div>
        <button class="primary" id="addb">Block this time</button>
      </div>
      <p class="msg" id="bmsg" role="alert"></p>
    </div>
    <div id="blocks" style="margin-top:12px"></div>

    <h2>Upcoming appointments</h2>
    <div id="appts"></div>
  </main>
</div>

<script>
(function(){
  var API="https://frxzhjmvoqyjzgdcupkg.supabase.co";
  var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyeHpoam12b3F5anpnZGN1cGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMDY5NTYsImV4cCI6MjEwNjU4Mjk1Nn0.J7eB9te8Jk1wATPw9ARjOnRMW5cZCPFnrLJE7Oterkk";
  var $=function(id){return document.getElementById(id)};
  var token=null;
  try{token=sessionStorage.getItem("cst-admin")}catch(e){}

  function h(extra){var o={apikey:ANON,Authorization:"Bearer "+(token||ANON),"Content-Type":"application/json"};for(var k in extra)o[k]=extra[k];return o}
  function el(tag,text,cls){var n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
  var tz={timeZone:"America/Chicago"};
  var fDay=function(iso){return new Date(iso).toLocaleDateString("en-US",Object.assign({weekday:"long",month:"long",day:"numeric"},tz))};
  var fTime=function(iso){return new Date(iso).toLocaleTimeString("en-US",Object.assign({hour:"numeric",minute:"2-digit"},tz))};

  function show(){
    var on=!!token;$("login").hidden=on;$("app").hidden=!on;
    if(on)refresh();
  }
  function logout(msg){token=null;try{sessionStorage.removeItem("cst-admin")}catch(e){}show();$("lmsg").textContent=msg||""}

  function api(path,opt){
    return fetch(API+path,Object.assign({headers:h()},opt)).then(function(r){
      if(r.status===401){logout("Your session expired. Please sign in again.");throw new Error("auth")}
      return r;
    });
  }

  $("go").addEventListener("click",function(){
    $("lmsg").textContent="";
    fetch(API+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:ANON,"Content-Type":"application/json"},
      body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(o){
      if(!o.ok){$("lmsg").textContent="Wrong email or password.";return}
      token=o.j.access_token;try{sessionStorage.setItem("cst-admin",token)}catch(e){}
      $("pw").value="";show();
    }).catch(function(){$("lmsg").textContent="Could not reach the server."});
  });
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
  $("out").addEventListener("click",function(){logout()});

  function refresh(){
    var nowIso=new Date().toISOString();
    api("/rest/v1/appointments?status=eq.confirmed&end_at=gte."+encodeURIComponent(nowIso)+"&order=start_at.asc").then(function(r){return r.json()}).then(function(rows){
      var box=$("appts");box.textContent="";
      if(!Array.isArray(rows)){box.appendChild(el("p","You do not have access to this schedule. Ask the site owner to add your email.","empty"));return}
      if(!rows.length){box.appendChild(el("p","No upcoming appointments.","empty"));return}
      var last="",ul=null;
      rows.forEach(function(a){
        var d=fDay(a.start_at);
        if(d!==last){last=d;box.appendChild(el("div",d,"day"));ul=el("ul");box.appendChild(ul)}
        var li=el("li"),left=el("div");
        left.appendChild(el("span",fTime(a.start_at)+" to "+fTime(a.end_at)+" · "+a.service,"when"));
        left.appendChild(el("small",a.vehicle_year+" "+a.vehicle_make+" "+a.vehicle_model+" · "+a.customer_name+" · Ref "+a.ref));
        var contact=el("small");var tel=el("a",a.phone);tel.href="tel:"+a.phone.replace(/[^\d+]/g,"");contact.appendChild(tel);
        if(a.email){contact.appendChild(document.createTextNode(" · "+a.email))}
        left.appendChild(contact);
        if(a.notes)left.appendChild(el("small","Notes: "+a.notes));
        var b=el("button","Cancel","danger");b.dataset.id=a.id;
        li.appendChild(left);li.appendChild(b);ul.appendChild(li);
      });
    }).catch(function(){});
    api("/rest/v1/blocks?end_at=gte."+encodeURIComponent(nowIso)+"&order=start_at.asc").then(function(r){return r.json()}).then(function(rows){
      var box=$("blocks");box.textContent="";
      if(!Array.isArray(rows)||!rows.length)return;
      var ul=el("ul");
      rows.forEach(function(x){
        var li=el("li"),left=el("div");
        left.appendChild(el("span",fDay(x.start_at)+", "+fTime(x.start_at)+" to "+fTime(x.end_at),"when"));
        left.appendChild(el("small","Blocked"+(x.reason?" · "+x.reason:"")));
        var b=el("button","Remove block");b.dataset.block=x.id;
        li.appendChild(left);li.appendChild(b);ul.appendChild(li);
      });
      box.appendChild(ul);
    }).catch(function(){});
  }

  $("appts").addEventListener("click",function(e){
    var id=e.target.dataset&&e.target.dataset.id;if(!id)return;
    if(!confirm("Cancel this appointment? The time opens up again. The customer is not notified, so call them."))return;
    api("/rest/v1/appointments?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"cancelled"})}).then(refresh).catch(function(){});
  });
  $("blocks").addEventListener("click",function(e){
    var id=e.target.dataset&&e.target.dataset.block;if(!id)return;
    api("/rest/v1/blocks?id=eq."+encodeURIComponent(id),{method:"DELETE"}).then(refresh).catch(function(){});
  });
  $("addb").addEventListener("click",function(){
    var m=$("bmsg");m.textContent="";
    if(!$("bd").value||!$("bf").value||!$("bt").value){m.textContent="Pick a day and a start and end time.";return}
    api("/rest/v1/rpc/add_block",{method:"POST",body:JSON.stringify({p_date:$("bd").value,p_from:$("bf").value,p_to:$("bt").value,p_reason:$("br").value})})
    .then(function(r){if(!r.ok)m.textContent="Could not block that time. Check that the end is after the start.";else{$("br").value="";refresh()}}).catch(function(){});
  });

  show();
})();
</script>
</body>
</html>
